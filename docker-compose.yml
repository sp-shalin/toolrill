services:
  toolrill:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${TOOLRILL_IMAGE_TARGET:-runtime}
    image: toolrill:${TOOLRILL_IMAGE_TARGET:-runtime}
    container_name: toolrill
    restart: "no"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - type: bind
        source: ${TOOLRILL_CONFIG_FILE:-./deploy/docker/toolrill.json}
        target: /config/toolrill.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      - DOTNET_ENVIRONMENT=Production
      - TOOLRILL_hosts__0__outgoing__0__url